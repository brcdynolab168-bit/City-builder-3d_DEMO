<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Mini City 3D</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: rgba(12, 17, 26, .90);
      --bg2: rgba(255, 255, 255, .045);
      --line: rgba(255, 255, 255, .10);
      --line2: rgba(255, 255, 255, .18);
      --text: #eaf0f7;
      --dim: #8d9db2;
      --accent: #f5a524;
      --accent-glow: rgba(245, 165, 36, .45);
      --teal: #3ecbd4;
      --good: #6fd58a;
      --warn: #ffbf47;
      --bad: #ff6b5e;
      --r: 8px;
      --shadow: 0 8px 26px rgba(0, 0, 0, .45), inset 0 1px 0 rgba(255, 255, 255, .06);
      --font: "Kanit", "Segoe UI", "Leelawadee UI", "Noto Sans Thai", "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: #111823; font-family: var(--font); color: var(--text); user-select: none; -webkit-user-select: none; letter-spacing: .1px; }
    #app { position: fixed; inset: 0; touch-action: none; }
    canvas { display: block; touch-action: none; }
    .ic { width: 1.15em; height: 1.15em; vertical-align: -0.2em; flex: none; }
    button { font-family: inherit; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.18); border-radius: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }

    /* ===== แผงมาตรฐาน ===== */
    .card, .panel { background: var(--bg); backdrop-filter: blur(10px) saturate(1.2); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); pointer-events: auto; }
    .bad { color: var(--bad) !important; }
    .dim { color: var(--dim); font-size: 11px; }

    /* ===== แถบด้านบน ===== */
    #topbar { position: fixed; top: 10px; left: 10px; right: 62px; display: flex; align-items: stretch; gap: 0; padding: 0; pointer-events: none; z-index: 4; flex-wrap: wrap; row-gap: 6px; }
    #topbar > .tseg { display: flex; align-items: center; gap: 12px; padding: 6px 14px; background: var(--bg); border: 1px solid var(--line); border-right-width: 0; backdrop-filter: blur(10px); box-shadow: var(--shadow); pointer-events: auto; position: relative; }
    #topbar > .tseg:first-child { border-radius: var(--r) 0 0 var(--r); }
    #topbar > .tseg:last-child { border-radius: 0 var(--r) var(--r) 0; border-right-width: 1px; }
    #topbar > .tseg + .seg::before { content: ""; position: absolute; left: 0; top: 20%; bottom: 20%; width: 1px; background: var(--line2); }
    .stat { display: flex; flex-direction: column; justify-content: center; min-width: 64px; cursor: default; line-height: 1.1; }
    .stat.click { cursor: pointer; }
    .stat.click:hover b { color: var(--accent); }
    .stat small { color: var(--dim); font-size: 10px; letter-spacing: .6px; text-transform: uppercase; display: flex; align-items: center; gap: 4px; margin-bottom: 2px; }
    .stat small .ic { width: 13px; height: 13px; }
    .stat b { font-size: 19px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .stat .sub { font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums; }
    .stat b.gold { color: #ffd36a; }
    .meter { height: 4px; width: 100%; background: rgba(255,255,255,.12); border-radius: 2px; margin-top: 4px; overflow: hidden; }
    .meter i { display: block; height: 100%; width: 0; background: var(--good); transition: width .4s, background .3s; border-radius: 2px; }
    .demand { display: flex; gap: 7px; align-items: flex-end; height: 40px; }
    .bar { width: 15px; height: 100%; background: rgba(255,255,255,.1); border-radius: 3px; position: relative; overflow: hidden; border: 1px solid rgba(255,255,255,.08); }
    .bar i { position: absolute; left: 0; right: 0; bottom: 0; transition: height .4s; }
    .bar span { position: absolute; top: 1px; width: 100%; text-align: center; font-size: 9px; font-weight: 700; color: #fff; text-shadow: 0 0 3px #000; }

    .cityb { gap: 10px !important; min-width: 170px; }
    .cityb .logo { width: 34px; height: 34px; border-radius: 8px; background: linear-gradient(145deg, #ffc65a, #d9820e); display: flex; align-items: center; justify-content: center; color: #1a1207; box-shadow: 0 0 14px var(--accent-glow); }
    .cityb .logo .ic { width: 20px; height: 20px; stroke-width: 2; }
    .cityb b { font-size: 15px; font-weight: 600; display: block; line-height: 1.1; max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cityb small { color: var(--dim); font-size: 11px; }
    .wx { display: flex; align-items: center; gap: 10px; }
    .wx .big { font-size: 28px; display: flex; color: #ffd27a; }
    .wx .big .ic { width: 1em; height: 1em; }
    .wx .t1 { font-size: 17px; font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums; }
    .wx .t2 { font-size: 10.5px; color: var(--dim); }
    #speed { display: flex; gap: 3px; padding: 3px; background: rgba(0,0,0,.28); border-radius: 7px; }
    #speed button { background: transparent; color: var(--dim); border: 0; border-radius: 5px; padding: 6px 10px; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; }
    #speed button:hover { color: #fff; background: rgba(255,255,255,.08); }
    #speed button.active { background: var(--accent); color: #1a1207; box-shadow: 0 0 10px var(--accent-glow); }

    /* ===== รางปุ่มด้านขวา ===== */
    #uiToggle { position: fixed; top: 10px; right: 10px; z-index: 5; }
    #rail { position: fixed; top: 58px; right: 10px; display: flex; flex-direction: column; gap: 6px; z-index: 5; }
    .rbtn { width: 42px; height: 42px; padding: 0; display: flex; align-items: center; justify-content: center; background: var(--bg); backdrop-filter: blur(10px); border: 1px solid var(--line); border-radius: var(--r); color: var(--dim); cursor: pointer; box-shadow: var(--shadow); transition: color .15s, border-color .15s, background .15s, transform .1s; position: relative; }
    .rbtn .ic { width: 20px; height: 20px; }
    .rbtn:hover { color: #fff; border-color: var(--line2); background: rgba(30, 40, 58, .95); }
    .rbtn:active { transform: scale(.95); }
    .rbtn:not(.closed) { color: var(--accent); border-color: rgba(245,165,36,.6); box-shadow: var(--shadow), 0 0 12px var(--accent-glow); }
    #uiToggle { color: #fff; }
    body.ui-hidden #uiToggle { opacity: .35; }
    body.ui-hidden #uiToggle:hover { opacity: 1; }
    body.ui-hidden #topbar, body.ui-hidden #rail, body.ui-hidden #side, body.ui-hidden #dock, body.ui-hidden #bottomRight,
    body.ui-hidden #news, body.ui-hidden #popPanel, body.ui-hidden #fly, body.ui-hidden #toolTab { display: none; }

    /* ===== ช่องลิ้นชัก (drawer) ===== */
    .drawer { position: fixed; z-index: 6; display: flex; flex-direction: column; overflow: hidden; transition: transform .3s cubic-bezier(.2,.8,.2,1), opacity .25s; }
    .drawer .dh { display: flex; align-items: center; gap: 10px; padding: 10px 12px 10px 14px; border-bottom: 1px solid var(--line); background: linear-gradient(180deg, rgba(255,255,255,.05), transparent); cursor: grab; touch-action: none; }
    .drawer .dh::before { content: ""; width: 3px; height: 16px; background: var(--accent); border-radius: 2px; box-shadow: 0 0 8px var(--accent-glow); }
    .drawer .dh b { font-size: 15px; font-weight: 600; letter-spacing: .4px; flex: 1; }
    .drawer .dh .x { background: none; border: 0; color: var(--dim); cursor: pointer; display: flex; padding: 4px; border-radius: 6px; }
    .drawer .dh .x:hover { color: #fff; background: rgba(255,255,255,.1); }
    .drawer .dh small { color: var(--dim); font-size: 10px; }
    .drawer .dbody { overflow-y: auto; flex: 1; padding: 10px 14px 14px; }

    #popPanel { top: 62px; left: 10px; width: min(470px, calc(100vw - 20px)); bottom: 100px; font-size: 12px; transform: translateX(calc(-100% - 20px)); opacity: 0; pointer-events: none; }
    #popPanel.show { transform: none; opacity: 1; pointer-events: auto; }
    #popPanel.dragging { transition: none; }
    #popPanel .pbody { overflow-y: auto; flex: 1; padding: 8px 14px 14px; }
    .ptabs { display: flex; gap: 2px; padding: 6px 10px 0; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
    .ptabs button { background: transparent; border: 0; border-bottom: 2px solid transparent; color: var(--dim); padding: 7px 11px; cursor: pointer; font-size: 12.5px; font-weight: 500; transition: color .15s; }
    .ptabs button:hover { color: #fff; }
    .ptabs button.on { color: var(--accent); border-bottom-color: var(--accent); }
    .ptabs.sub { margin-top: 10px; padding: 0 0 6px; border: 0; gap: 6px; }
    .ptabs.sub button { border: 1px solid var(--line); border-radius: 14px; padding: 3px 12px; font-size: 11.5px; }
    .ptabs.sub button.on { background: rgba(245,165,36,.16); border-color: rgba(245,165,36,.55); }
    .kcs { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 6px; margin: 4px 0 6px; }
    .kc { background: var(--bg2); border: 1px solid var(--line); border-radius: 7px; padding: 7px 10px; }
    .kc small { display: block; color: var(--dim); font-size: 10px; letter-spacing: .5px; text-transform: uppercase; }
    .kc b { font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .psec { padding: 9px 0 6px; border-top: 1px solid var(--line); }
    .psec:first-child { border-top: 0; }
    .psec h4 { margin: 0 0 5px; font-size: 11.5px; color: var(--accent); font-weight: 600; letter-spacing: .6px; text-transform: uppercase; }
    .psec h5 { margin: 7px 0 2px; font-size: 10.5px; color: var(--dim); font-weight: 500; }
    .pb { display: grid; grid-template-columns: 104px 1fr 96px; gap: 8px; align-items: center; margin: 3px 0; }
    .pb .pt { height: 7px; background: rgba(255,255,255,.1); border-radius: 4px; overflow: hidden; }
    .pb .pt i { display: block; height: 100%; border-radius: 4px; }
    .pb em { font-style: normal; text-align: right; color: #cfd8e3; font-variant-numeric: tabular-nums; }
    .kv { display: flex; justify-content: space-between; margin: 3px 0; }
    .kv span { color: #b5c1d0; }
    .kv small { color: var(--dim); }
    .asks { margin-top: 5px; color: #c7d2e0; }
    .tx { display: grid; grid-template-columns: 1fr 80px 64px; gap: 8px; align-items: center; padding: 4px 0; border-top: 1px solid rgba(255,255,255,.05); }
    .tx small { display: block; color: var(--dim); font-size: 10px; }
    .tx em { font-style: normal; text-align: right; color: var(--good); font-variant-numeric: tabular-nums; }
    .tx .pt { height: 6px; background: rgba(255,255,255,.1); border-radius: 3px; overflow: hidden; }
    .tx .pt i { display: block; height: 100%; }
    .rr { display: flex; gap: 9px; padding: 5px 0; border-top: 1px solid rgba(255,255,255,.05); }
    .rr .ri { font-size: 16px; }
    .rr .rd { display: block; color: var(--dim); font-size: 10px; }

    #side { top: 58px; right: 62px; width: 310px; max-height: calc(100vh - 160px); font-size: 12px; line-height: 1.55; transform: translateX(calc(100% + 80px)); opacity: 0; pointer-events: none; }
    #side:not(.closed) { transform: none; opacity: 1; pointer-events: auto; }
    #side.closed { transform: translateX(calc(100% + 80px)); opacity: 0; pointer-events: none; }
    #side .dbody { display: flex; flex-direction: column; gap: 10px; }
    #side .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    #side .row > b { font-weight: 500; color: #c7d2e0; }
    .seg { display: flex; border: 1px solid var(--line2); border-radius: 7px; overflow: hidden; background: rgba(0,0,0,.2); }
    .seg button { background: transparent; border: 0; color: var(--dim); padding: 5px 11px; cursor: pointer; font-size: 12px; display: inline-flex; align-items: center; }
    .seg button:hover { color: #fff; }
    .seg button.active { background: var(--accent); color: #1a1207; font-weight: 600; }
    .seg.icons button { padding: 5px 9px; }
    .seg.icons .ic { width: 17px; height: 17px; }
    .wbtn { background: var(--bg2); border: 1px solid var(--line2); color: var(--text); border-radius: 7px; padding: 8px 0; cursor: pointer; font-size: 13px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .wbtn:hover { background: rgba(255,255,255,.12); border-color: rgba(255,255,255,.3); }
    .wbtn.danger { color: #ffb0a8; border-color: rgba(255,107,94,.35); }
    .wbtn.danger:hover { background: rgba(255,107,94,.16); }
    #helpText { color: var(--dim); font-size: 11.5px; line-height: 1.6; border-top: 1px solid var(--line); padding-top: 8px; }
    #live, #fps { color: var(--dim); font-size: 11px; }

    /* ===== มุมขวาล่าง: แผนที่ย่อ + กล้อง ===== */
    #bottomRight { position: fixed; right: 10px; bottom: 10px; display: flex; gap: 8px; align-items: flex-end; z-index: 4; }
    #minimapWrap { padding: 5px; }
    #minimap { width: 196px; height: 196px; display: block; border-radius: 5px; cursor: crosshair; background: #123; }
    .cam { display: flex; flex-direction: column; gap: 5px; }
    .cam button { width: 36px; height: 36px; background: var(--bg); border: 1px solid var(--line); color: var(--dim); border-radius: 7px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow); }
    .cam button .ic { width: 17px; height: 17px; }
    .cam button:hover { color: var(--accent); border-color: rgba(245,165,36,.5); }

    /* ===== แถบเครื่องมือด้านล่าง (dock) ===== */
    #dock { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); max-width: calc(100vw - 560px); z-index: 4; transition: transform .3s cubic-bezier(.2,.8,.2,1), opacity .25s; padding: 0; }
    #dock.closed { transform: translate(-50%, calc(100% + 30px)); opacity: 0; pointer-events: none; }
    #toolbar { display: flex; gap: 4px; padding: 7px; overflow-x: auto; scrollbar-width: thin; }
    .tool { position: relative; background: linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.02)); border: 1px solid var(--line); color: var(--text); border-radius: 7px; padding: 8px 6px 6px; cursor: pointer; font-size: 12px; text-align: center; min-width: 78px; white-space: nowrap; display: flex; flex-direction: column; align-items: center; gap: 2px; transition: transform .12s, border-color .15s, background .15s, box-shadow .15s; }
    .tool .ico { display: flex; color: #9db4cf; transition: color .15s, transform .15s; }
    .tool .ico .ic { width: 25px; height: 25px; stroke-width: 1.6; }
    .tool .lbl { font-weight: 500; max-width: 84px; overflow: hidden; text-overflow: ellipsis; }
    .tool small { color: #ffd36a; font-size: 10.5px; font-variant-numeric: tabular-nums; }
    .tool:hover { transform: translateY(-3px); border-color: var(--line2); background: linear-gradient(180deg, rgba(255,255,255,.13), rgba(255,255,255,.04)); }
    .tool:hover .ico { color: #fff; transform: scale(1.08); }
    .tool.active { border-color: var(--accent); background: linear-gradient(180deg, rgba(245,165,36,.26), rgba(245,165,36,.07)); box-shadow: 0 0 14px var(--accent-glow), inset 0 -2px 0 var(--accent); }
    .tool.active .ico { color: var(--accent); }
    #toolTab { position: fixed; bottom: 98px; left: 50%; margin-left: -22px; width: 44px; height: 18px; border-radius: 8px 8px 0 0; background: var(--bg); border: 1px solid var(--line); border-bottom: 0; color: var(--dim); cursor: pointer; z-index: 4; display: flex; align-items: center; justify-content: center; font-size: 12px; transition: transform .3s cubic-bezier(.2,.8,.2,1), color .15s; }
    #toolTab:hover { color: var(--accent); }
    #toolTab.closed { transform: translateY(80px); }

    /* ===== เมนูตัวเลือกย่อย (เด้งเหนือปุ่ม) ===== */
    #fly { position: fixed; z-index: 8; width: 320px; max-height: 70vh; overflow-y: auto; background: rgba(10, 15, 24, .96); backdrop-filter: blur(12px); border: 1px solid var(--line2); border-radius: 10px; padding: 6px; opacity: 0; transform: translateY(8px); pointer-events: none; transition: opacity .15s, transform .15s; box-shadow: 0 14px 36px rgba(0,0,0,.55); }
    #fly.show { opacity: 1; transform: none; pointer-events: auto; }
    #fly .ft { font-size: 11px; color: var(--accent); letter-spacing: .8px; text-transform: uppercase; padding: 4px 9px 6px; font-weight: 600; }
    #fly .fi { display: grid; grid-template-columns: 1fr auto; gap: 1px 10px; width: 100%; text-align: left; background: transparent; border: 1px solid transparent; border-radius: 7px; color: #fff; padding: 7px 9px; cursor: pointer; }
    #fly .fi:hover { background: rgba(255,255,255,.09); }
    #fly .fi.on { border-color: rgba(245,165,36,.7); background: rgba(245,165,36,.13); }
    #fly .fn { font-size: 14px; font-weight: 500; }
    #fly .fc { font-size: 13px; color: #ffd36a; font-weight: 600; }
    #fly .fs { grid-column: 1 / -1; font-size: 11px; color: var(--dim); line-height: 1.35; }

    /* ===== ข่าวเมือง (มุมซ้ายล่าง) ===== */
    #news { position: fixed; left: 10px; bottom: 10px; width: 300px; font-size: 12px; padding: 0; z-index: 3; transition: transform .3s cubic-bezier(.2,.8,.2,1), opacity .25s; display: flex; flex-direction: column; }
    #news.closed { transform: translateX(calc(-100% - 24px)); opacity: 0; pointer-events: none; }
    #newsHead { display: flex; justify-content: space-between; align-items: center; padding: 7px 8px 7px 12px; border-bottom: 1px solid var(--line); font-weight: 600; letter-spacing: .4px; }
    #newsHead b { display: flex; align-items: center; gap: 7px; font-size: 12.5px; }
    #newsHead b::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--bad); box-shadow: 0 0 8px var(--bad); animation: livepulse 1.6s infinite; }
    @keyframes livepulse { 50% { opacity: .35; } }
    #newsX { color: var(--dim); cursor: pointer; display: flex; padding: 2px; border-radius: 5px; }
    #newsX:hover { color: #fff; background: rgba(255,255,255,.1); }
    #newsList { max-height: 176px; overflow-y: auto; display: flex; flex-direction: column; padding: 4px 6px 6px; }
    .ni { display: flex; gap: 8px; line-height: 1.35; padding: 5px 6px; border-radius: 6px; }
    .ni:hover { background: rgba(255,255,255,.05); }
    .ni i { flex: none; width: 4px; border-radius: 2px; align-self: stretch; }
    .ni small { display: block; color: var(--dim); font-size: 10px; }
    .ni.dim { color: var(--dim); }
    .ni.go { cursor: pointer; }
    .ni.go:hover { background: rgba(245,165,36,.12); outline: 1px solid rgba(245,165,36,.35); }
    .ni { user-select: none; }

    #toast { position: fixed; top: 76px; left: 50%; transform: translate(-50%, -8px); background: rgba(12,17,26,.96); border: 1px solid rgba(255,107,94,.6); border-left: 4px solid var(--bad); padding: 9px 18px; border-radius: 8px; opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none; max-width: 90vw; text-align: center; z-index: 9; box-shadow: 0 8px 26px rgba(0,0,0,.5); font-weight: 500; }
    #toast.show { opacity: 1; transform: translate(-50%, 0); }

    /* ===== หน้า Intro / เมนู ===== */
    #menu { position: fixed; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center; padding: 16px; overflow-y: auto;
      background: radial-gradient(ellipse at center, rgba(8,14,26,.45) 0%, rgba(8,14,26,.82) 100%); backdrop-filter: blur(3px); }
    #menu.show { display: flex; animation: mfade .35s ease; }
    @keyframes mfade { from { opacity: 0; } to { opacity: 1; } }
    body.menu-open #topbar, body.menu-open #side, body.menu-open #dock, body.menu-open #rail, body.menu-open #bottomRight, body.menu-open #news,
    body.menu-open #uiToggle, body.menu-open #fly, body.menu-open #toast, body.menu-open #popPanel { display: none !important; }
    .mlang { position: fixed; top: 14px; right: 14px; display: flex; gap: 4px; background: rgba(20,28,40,.7); border: 1px solid rgba(255,255,255,.16); border-radius: 10px; padding: 4px; z-index: 2; }
    .mlang button { background: transparent; border: 0; color: #fff; padding: 6px 12px; border-radius: 7px; cursor: pointer; font-size: 13px; }
    .mlang button.on { background: rgba(245,165,36,.34); }
    .mpanel { width: min(560px, 100%); margin: auto; text-align: center; }
    .mpanel.scr-new { width: min(820px, 100%); }
    .mpanel.scr-load { width: min(760px, 100%); }
    .mlogo { font-size: clamp(46px, 9vw, 84px); line-height: 1; font-weight: 800; letter-spacing: 3px; text-shadow: 0 6px 30px rgba(0,0,0,.5); }
    .mlogo span { color: var(--accent); } .mlogo b { color: #fff; } .mlogo i { font-style: normal; color: #ffd27a; margin-left: 10px; }
    .mtag { opacity: .85; margin: 6px 0 26px; font-size: 16px; }
    .mbtns { display: flex; flex-direction: column; gap: 10px; align-items: stretch; }
    .mb { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.2); color: #fff; border-radius: 12px; padding: 13px 18px; cursor: pointer; font-size: 17px; font-weight: 600; transition: background .15s, transform .1s; }
    .mb small { font-size: 12px; opacity: .7; font-weight: 400; }
    .mb:hover:not(:disabled) { background: rgba(255,255,255,.2); transform: translateY(-1px); }
    .mb:disabled { opacity: .35; cursor: default; }
    .mb.primary { background: linear-gradient(180deg, #f7b73a, #d98a10); border-color: #ffd27a; color: #1a1207; }
    .mb.primary:hover:not(:disabled) { background: linear-gradient(180deg, #ffc65a, #e89a1c); }
    .mb.danger { background: rgba(200,60,60,.25); border-color: rgba(255,120,120,.4); }
    .mb.danger:hover { background: rgba(220,70,70,.45) !important; }
    .mfoot { margin-top: 26px; font-size: 12px; opacity: .55; line-height: 1.7; }
    .mtitle { font-size: 26px; font-weight: 700; margin-bottom: 16px; }
    .mapgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 16px; }
    .mapcard { display: flex; flex-direction: column; gap: 5px; text-align: left; background: rgba(20,28,40,.78); border: 2px solid rgba(255,255,255,.14); border-radius: 12px; padding: 8px; color: #fff; cursor: pointer; transition: border-color .15s, transform .1s; }
    .mapcard:hover { transform: translateY(-2px); border-color: rgba(255,255,255,.4); }
    .mapcard.on { border-color: var(--accent); background: rgba(120,80,20,.55); }
    .mapcard canvas { width: 100%; aspect-ratio: 1; border-radius: 8px; image-rendering: auto; background: #123; }
    .mapcard b { font-size: 15px; } .mapcard small { opacity: .7; font-size: 11.5px; line-height: 1.4; }
    .mfield { display: flex; align-items: center; gap: 10px; margin: 0 auto 14px; max-width: 420px; text-align: left; }
    .mfield span { min-width: 90px; opacity: .8; font-size: 14px; }
    .mfield input[type=text], .mfield input:not([type]) { flex: 1; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.25); color: #fff; border-radius: 8px; padding: 9px 12px; font-size: 15px; font-family: inherit; }
    .mfield em { min-width: 28px; font-style: normal; opacity: .7; text-align: right; font-size: 13px; }
    .mfield input[type=range] { flex: 1; }
    .mrow { display: flex; gap: 10px; justify-content: center; margin-top: 10px; }
    .mrow .mb { min-width: 150px; }
    .slots { display: flex; flex-direction: column; gap: 10px; max-height: 56vh; overflow-y: auto; padding: 2px; }
    .slot { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; text-align: left; background: rgba(20,28,40,.8); border: 1px solid rgba(255,255,255,.16); border-radius: 12px; padding: 12px 14px; }
    .slot.cur { border-color: var(--accent); }
    .slot .si { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .slot .si b { font-size: 17px; } .slot .si span { font-size: 13px; opacity: .85; } .slot .si small { opacity: .55; font-size: 11.5px; }
    .slot .sb { display: flex; gap: 6px; flex-wrap: wrap; }
    .slot .sb .mb { padding: 7px 12px; font-size: 13px; border-radius: 8px; }
    .empty { opacity: .6; padding: 30px 0; }
    .msec { text-align: left; background: rgba(20,28,40,.78); border: 1px solid rgba(255,255,255,.14); border-radius: 12px; padding: 12px 16px; margin-bottom: 12px; }
    .msec h4 { margin: 0 0 8px; font-size: 14px; opacity: .8; font-weight: 600; }
    .msec .mfield { max-width: none; margin-bottom: 8px; }
    .mseg { display: flex; border: 1px solid rgba(255,255,255,.22); border-radius: 9px; overflow: hidden; width: fit-content; }
    .mseg button { background: transparent; border: 0; color: #fff; padding: 8px 16px; cursor: pointer; font-size: 14px; }
    .mseg button.on { background: rgba(245,165,36,.36); }
    .mdesc { font-size: 12px; opacity: .65; margin-top: 8px; line-height: 1.5; }
    .mchk { font-size: 14px; display: flex; align-items: center; gap: 8px; cursor: pointer; }


    @media (max-width: 1100px) {
      #dock { max-width: calc(100vw - 24px); bottom: 12px; }
      #bottomRight { bottom: 108px; }
      #minimap { width: 140px; height: 140px; }
      #news { bottom: 108px; width: 250px; }
      #toolTab { display: none; }
    }
    @media (max-width: 760px) {
      #side { right: 10px; top: 108px; }
      .stat { min-width: 52px; }
      .cityb { display: none !important; }
      #popPanel { bottom: 190px; }
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <!-- แถบสถานะด้านบน -->
  <div id="topbar">
    <div class="tseg cityb">
      <div class="logo" data-ic="city"></div>
      <div><b id="cityName">Mini City</b><small><span data-i18n="hud.day">วันที่</span> <span id="day">0</span></small></div>
    </div>
    <div class="tseg">
      <div class="stat click" id="moneyCard"><small><span data-ic="money"></span><span data-i18n="hud.money">เงิน</span></small><b class="gold" id="money">0</b><span class="sub"><span data-i18n="hud.net">รายได้สุทธิ/วัน</span> <span id="net">0</span></span></div>
    </div>
    <div class="tseg">
      <div class="stat click" id="popCard"><small><span data-ic="pop"></span><span data-i18n="hud.pop">ประชากร</span></small><b id="pop">0</b></div>
      <div class="stat"><small><span data-ic="jobs"></span><span data-i18n="hud.jobs">งาน</span></small><b id="jobs">0</b></div>
    </div>
    <div class="tseg">
      <div class="stat click" id="powerCard" style="min-width:86px" data-i18n-title="hud.powerTip"><small><span data-ic="power"></span><span data-i18n="hud.power">ไฟฟ้า</span></small><b id="power" style="font-size:15px">0/0</b><div class="meter"><i id="powerBar"></i></div></div>
      <div class="stat click" id="waterCard" style="min-width:86px" data-i18n-title="hud.waterTip"><small><span data-ic="water"></span><span data-i18n="hud.water">น้ำประปา</span></small><b id="water" style="font-size:15px">0/0</b><div class="meter"><i id="waterBar" style="background:var(--teal)"></i></div></div>
    </div>
    <div class="tseg" data-i18n-title="hud.demandTip">
      <div class="demand">
        <div class="bar"><i id="dR" style="background:#4caf50"></i><span>R</span></div>
        <div class="bar"><i id="dC" style="background:#2196f3"></i><span>C</span></div>
        <div class="bar"><i id="dI" style="background:#ffc107"></i><span>I</span></div>
      </div>
    </div>
    <div class="tseg">
      <div class="wx">
        <div class="big" id="wxIcon"></div>
        <div>
          <div class="t1"><span id="clock">06:00</span> <span id="period" style="font-weight:500;font-size:13px;color:var(--accent)"></span> · <span id="temp">28°C</span></div>
          <div class="t2"><span id="wxText">แจ่มใส</span> · <span id="windv">ลม 10 กม./ชม.</span></div>
        </div>
      </div>
    </div>
    <div class="tseg">
      <div id="speed">
        <button data-s="0" data-i18n-title="speed.pause"><span data-ic="pause"></span></button><button data-s="1" class="active"><span data-ic="play"></span>1x</button><button data-s="3"><span data-ic="fast"></span>3x</button>
      </div>
    </div>
  </div>

  <!-- รางปุ่มขวา -->
  <button id="uiToggle" class="rbtn" title="ซ่อน/แสดง UI (H)"></button>
  <div id="rail">
    <button id="popBtn" class="rbtn closed" data-i18n-title="btn.pop"><span data-ic="info"></span></button>
    <button id="sideTab" class="rbtn closed" data-i18n-title="btn.sideTab"><span data-ic="settings"></span></button>
    <button id="newsTab" class="rbtn closed" data-i18n-title="news.title"><span data-ic="news"></span></button>
  </div>

  <!-- ลิ้นชักตั้งค่า -->
  <div id="side" class="drawer card closed">
    <div class="dh"><b data-i18n="side.title">ตั้งค่า</b><button class="x" id="sideX"><span data-ic="close"></span></button></div>
    <div class="dbody">
      <div class="row"><b data-i18n="side.graphics">กราฟิก</b>
        <div class="seg" id="qSeg">
          <button data-q="low" data-i18n="q.low">ต่ำ</button><button data-q="med" data-i18n="q.med">กลาง</button><button data-q="high" data-i18n="q.high">สูง</button><button data-q="rtx">RTX</button>
        </div>
      </div>
      <div class="dim" id="qDesc"></div>
      <div class="row"><b data-i18n="side.weather">สภาพอากาศ</b>
        <div class="seg icons" id="wSeg">
          <button data-w="auto" class="active" data-i18n-title="w.auto"><span data-ic="auto"></span></button>
          <button data-w="clear" data-i18n-title="w.clear"><span data-ic="sun"></span></button>
          <button data-w="cloudy" data-i18n-title="w.cloudy"><span data-ic="cloud"></span></button>
          <button data-w="rain" data-i18n-title="w.rain"><span data-ic="rain"></span></button>
          <button data-w="storm" data-i18n-title="w.storm"><span data-ic="storm"></span></button>
        </div>
      </div>
      <div class="row"><b data-i18n="side.control">ควบคุม</b>
        <div class="seg" id="mSeg">
          <button data-m="trackpad" data-i18n="m.trackpad">ทัชแพด</button><button data-m="mouse" data-i18n="m.mouse">เมาส์</button>
        </div>
      </div>
      <button class="wbtn" id="menuBtn"><span data-ic="menu"></span><span data-i18n="btn.menu">เมนูหลัก</span></button>
      <button class="wbtn danger" id="reset"><span data-ic="reset"></span><span data-i18n="btn.reset">เริ่มเมืองนี้ใหม่</span></button>
      <div id="helpText"></div>
      <div id="live"></div>
      <div id="fps"></div>
    </div>
  </div>

  <!-- ข้อมูลเมือง (ลิ้นชักซ้าย ลากหัวไปทางซ้ายเพื่อปิดได้) -->
  <div id="popPanel" class="drawer card"></div>

  <!-- มุมขวาล่าง -->
  <div id="bottomRight">
    <div class="cam">
      <button id="camIn" data-i18n-title="cam.in"><span data-ic="plus"></span></button>
      <button id="camOut" data-i18n-title="cam.out"><span data-ic="minus"></span></button>
      <button id="camL" data-i18n-title="cam.left"><span data-ic="rotL"></span></button>
      <button id="camR" data-i18n-title="cam.right"><span data-ic="rotR"></span></button>
      <button id="camHome" data-i18n-title="cam.home"><span data-ic="home"></span></button>
    </div>
    <div id="minimapWrap" class="card"><canvas id="minimap" width="294" height="294"></canvas></div>
  </div>

  <!-- แถบเครื่องมือ -->
  <button id="toolTab" data-i18n-title="btn.toolTab">⌄</button>
  <div id="dock" class="card"><div id="toolbar"></div></div>

  <!-- ข่าวเมือง -->
  <div id="news" class="card closed"><div id="newsHead"><b data-i18n="news.title">ข่าวเมือง</b><span id="newsX"><span data-ic="close"></span></span></div><div id="newsList"></div></div>

  <div id="toast"></div>
  <div id="menu"></div>

  <script>
    // แสดง error แรกที่เกิดขึ้นบนหน้าจอ (ช่วยหาสาเหตุเมื่อหน้าจอว่าง)
    (function () {
      function show(msg) {
        var d = document.getElementById('errbox');
        if (!d) { d = document.createElement('pre'); d.id = 'errbox'; d.style.cssText = 'position:fixed;left:10px;right:10px;bottom:10px;max-height:40vh;overflow:auto;z-index:99999;background:#300;color:#ffd0d0;border:1px solid #f66;padding:10px;font:12px/1.4 monospace;white-space:pre-wrap;user-select:text'; document.body.appendChild(d); }
        if (d.textContent.length < 3000) d.textContent += msg + '\n\n';
      }
      window.addEventListener('error', function (e) { show('ERROR: ' + e.message + '\n' + (e.filename || '') + ':' + (e.lineno || '') + (e.error && e.error.stack ? '\n' + e.error.stack : '')); });
      window.addEventListener('unhandledrejection', function (e) { var r = e.reason; show('PROMISE: ' + (r && r.stack ? r.stack : r)); });
    })();
  </script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
